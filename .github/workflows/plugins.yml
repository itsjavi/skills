name: Plugins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: npm run check
      - run: npm test
      - name: Install pinned workspace validation tools
        run: |
          npm install --global backlog.md@1.51.0
          npm exec --yes --package=ajv-cli@5.0.0 -- ajv help
      - run: npm run test:agent-workspace
