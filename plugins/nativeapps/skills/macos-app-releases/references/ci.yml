# Runs the tests on pull requests and pushes to main. Releases come from release.yml (tags only): macOS runner
# minutes are expensive, so nothing else runs on macOS.
# Template from the macos-app-releases skill: replace <App> and add the app's other test packages.
name: Tests

on:
  pull_request:
    paths: ["Sources/**", "Tests/**", "Package.swift", "Package.resolved", "Resources/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["Sources/**", "Tests/**", "Package.swift", "Package.resolved", "Resources/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: ./scripts/ci-select-xcode.sh
      - name: Test
        run: swift test --disable-keychain
      # The release configuration checks concurrency more strictly than the debug build the tests use: a tag run once
      # failed on an error that only -c release reported.
      - name: Release build
        run: swift build -c release --disable-keychain --product "<App>"
